<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบจัดการห้องเช่า</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f7f1e8; --panel:#efe2d0; --brown:#8a6347; --brown-dark:#5e4129;
    --line:#d9c5ae; --filter:#fff3d1; --filter-line:#e8c868; --card:#fff;
    --ok:#3f8f5b; --busy:#c0504d; --book:#d98a1f; --fix:#8a8a8a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:#3b2e24}
  .hidden{display:none!important}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px}
  label{display:block;font-size:13px;margin:10px 0 4px;color:#6b5645}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  textarea{resize:vertical;min-height:70px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brown);border-color:transparent}
  .btn{background:var(--brown);color:#fff;width:100%;margin-top:12px}
  .btn:hover{background:var(--brown-dark)}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.ghost{background:transparent;color:var(--brown-dark);border:1px solid var(--brown)}
  .msg{font-size:13px;margin-top:8px;min-height:18px}
  .row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
  .row2b{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  /* หน้าล็อกอิน */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .loginCard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:360px}
  .loginCard h1{margin:0 0 6px;color:var(--brown-dark);font-size:24px}
  .loginCard p{margin:0 0 10px;color:#7a6654;font-size:14px}

  /* โครงหลัก */
  .layout{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
  aside{background:var(--panel);border-right:2px solid var(--line);padding:20px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
  aside h1{margin:0 0 4px;font-size:22px;color:var(--brown-dark)}
  .clock{font-size:13px;color:#7a6654;margin-bottom:14px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .stat{background:#fff;border-radius:10px;padding:8px;text-align:center;border:1px solid var(--line)}
  .stat b{display:block;font-size:20px;color:var(--brown)}
  .stat span{font-size:12px;color:#7a6654}
  .stat.warn{background:#fde4e2;border-color:#e3a8a4}
  .stat.warn b{color:var(--busy)}
  h2{font-size:16px;margin:16px 0 8px;color:var(--brown-dark)}
  .userbar{font-size:12px;color:#7a6654;margin-bottom:6px}
  .contractBox{background:#fbf5ea;border:1px dashed var(--brown);border-radius:10px;padding:2px 10px 10px;margin-top:10px}
  .contractBox label{margin-top:8px}

  /* รูปในฟอร์ม */
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#eadfce}
  .th.cover{border-color:var(--brown)}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th button{position:absolute;padding:0;width:24px;height:24px;line-height:24px;font-size:12px;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff}
  .th .x{top:4px;right:4px}
  .th [data-cover]{bottom:4px;left:4px;background:rgba(138,99,71,.9)}
  .th .tag{position:absolute;bottom:0;left:0;right:0;background:var(--brown);color:#fff;font-size:11px;text-align:center;padding:2px}
  .hint{font-size:12px;color:#7a6654;margin-top:4px}

  /* ขวา */
  main{padding:20px}
  .filter{background:var(--filter);border:2px solid var(--filter-line);border-radius:12px;padding:14px 16px;
    display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .filter div{flex:1;min-width:130px}
  .filter label{margin-top:0}
  .filter .btn{width:auto;margin:0}
  .count{margin:14px 2px 10px;color:#6b5645;font-size:14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 2px 8px rgba(94,65,41,.08);display:flex;flex-direction:column}
  .imgwrap{position:relative;height:180px;background:#eadfce;cursor:pointer}
  .imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
  .imgwrap .noimg{height:100%;display:flex;align-items:center;justify-content:center;color:#a38b74}
  .imgwrap .cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 9px;border-radius:99px}
  .imgwrap .zone{position:absolute;left:8px;top:8px;background:var(--brown-dark);color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .imgwrap .zone.none{background:#9a9a9a;font-weight:400}
  .card .body{padding:12px 14px;flex:1}
  .card .top{display:flex;justify-content:space-between;align-items:center}
  .card .no{font-size:18px;font-weight:700;color:var(--brown-dark)}
  .badge{font-size:12px;color:#fff;padding:3px 10px;border-radius:99px}
  .price{font-size:18px;color:var(--brown);margin:6px 0}
  .furn{font-size:13px;color:#6b5645;white-space:pre-line}
  .contract{font-size:12px;color:#8a7662;margin-top:6px}
  .pay{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pay b{display:block;font-size:14px}
  .pay.paid{background:#e2f3e8;color:#23623b}
  .pay.upcoming{background:#f3ece1;color:#6b5645}
  .pay.overdue{background:#fde4e2;color:#a03a35}
  .pay button{padding:5px 10px;font-size:12px;background:rgba(255,255,255,.8);color:#3b2e24;border:1px solid rgba(0,0,0,.2);white-space:nowrap}
  .actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
  .actions button{flex:1 1 40%;padding:7px;font-size:13px}
  .edit{background:#f1e4d1;color:var(--brown-dark)}
  .del{background:#f7dcd9;color:#a03a35}
  .hist{background:#e9eef7;color:#2f4a7a}
  .endc{background:#fdebd0;color:#9a5a10}
  .empty{grid-column:1/-1;text-align:center;padding:40px;color:#8a7662}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(40,28,18,.8);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .mbox{background:var(--bg);border-radius:16px;width:100%;max-width:860px;max-height:94vh;overflow:auto;padding:16px;position:relative}
  .mbox h3{margin:0 70px 10px 0;color:var(--brown-dark)}
  #mClose,#calClose{position:absolute;top:12px;right:12px;background:var(--panel);color:var(--brown-dark);padding:6px 12px}
  .mmain{position:relative;background:#000;border-radius:10px;overflow:hidden}
  #mImg{width:100%;max-height:60vh;object-fit:contain;display:block}
  .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.8);font-size:22px;padding:6px 14px}
  #mPrev{left:8px} #mNext{right:8px}
  .mthumbs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
  .mthumbs img{width:80px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.6;border:2px solid transparent}
  .mthumbs img.on{opacity:1;border-color:var(--brown)}
  .minfo{margin-top:10px;font-size:14px;color:#6b5645;white-space:pre-line}

  /* ปฏิทินค่าเช่า */
  .calinfo{font-size:13px;color:#6b5645;margin-bottom:8px}
  .calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .calnav b{font-size:16px;color:var(--brown-dark)}
  .calnav button{background:var(--panel);color:var(--brown-dark);padding:6px 16px;font-size:18px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .cal .wd{text-align:center;font-size:12px;color:#7a6654;padding:4px 0}
  .cal .day{aspect-ratio:1.8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:8px;background:#fff;border:1px solid var(--line);font-size:14px}
  .cal .day.today{outline:2px solid var(--brown)}
  .cal .day.start{background:#e9dcc8}
  .cal .day.due{cursor:pointer;font-weight:700;color:#fff;border-color:transparent}
  .cal .day.due.paid{background:var(--ok)}
  .cal .day.due.upcoming{background:var(--book)}
  .cal .day.due.overdue{background:var(--busy)}
  .cal .day.sel{box-shadow:0 0 0 3px var(--brown-dark)}
  .cal small{font-size:10px;font-weight:400;line-height:1}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#6b5645;margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;min-height:48px}
  .pnote{margin:8px 0;padding:6px 10px;border-radius:8px;font-size:13px}
  .pnote.paid{background:#e2f3e8;color:#23623b}
  .pnote.overdue{background:#fde4e2;color:#a03a35}
  .errbox{background:#fde4e2;color:#a03a35;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
  .tblwrap{overflow-x:auto}
  table.histT{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
  table.histT th{background:var(--panel);text-align:left;padding:8px;color:var(--brown-dark);white-space:nowrap}
  table.histT td{padding:7px 8px;border-top:1px solid #efe5d6;white-space:nowrap}
  table.histT tr.row{cursor:pointer}
  table.histT tr.on td{background:#fff6dd}
  table.histT .num{text-align:right}
  table.histT .st.paid{color:var(--ok);font-weight:700}
  table.histT .st.overdue{color:var(--busy);font-weight:700}
  table.histT td.chk,table.histT th.chk{width:56px;text-align:center}
  table.histT input[type=checkbox]{width:20px;height:20px;padding:0;cursor:pointer;accent-color:var(--ok)}
  table.histT input.inD{width:auto;padding:4px 6px;font-size:13px}
  table.histT input.inA{width:90px;padding:4px 6px;font-size:13px;text-align:right}
  table.histT .late{display:block;color:var(--book);font-size:12px;font-weight:400}
  .sum{margin-top:8px;font-size:14px;color:var(--brown-dark);font-weight:700}

  @media(max-width:800px){
    .layout{grid-template-columns:1fr}
    aside{position:static;max-height:none}
  }
</style>
</head>
<body>

<!-- หน้าล็อกอิน -->
<div id="loginView">
  <div class="loginCard">
    <h1>🏢 ระบบจัดการห้องเช่า</h1>
    <p>เข้าสู่ระบบผู้ดูแล</p>
    <label>อีเมล</label><input id="email" type="email">
    <label>รหัสผ่าน</label><input id="password" type="password">
    <button class="btn" id="btnLogin">เข้าสู่ระบบ</button>
    <div class="msg" id="loginMsg" style="color:#a03a35"></div>
  </div>
</div>

<!-- ตัวระบบ -->
<div id="app" class="layout hidden">

  <aside>
    <h1>🏢 ระบบจัดการห้องเช่า</h1>
    <div class="clock">เวลาไทย: <span id="clock"></span></div>

    <div class="stats">
      <div class="stat"><b id="stAll">0</b><span>ห้องทั้งหมด</span></div>
      <div class="stat"><b id="stFree">0</b><span>ว่าง</span></div>
      <div class="stat"><b id="stBusy">0</b><span>มีผู้เช่า</span></div>
      <div class="stat warn"><b id="stWait">0</b><span>เกินกำหนดชำระ</span></div>
    </div>

    <div class="userbar"><span id="userEmail"></span> · <a href="#" id="btnLogout">ออกจากระบบ</a></div>

    <h2 id="formTitle">เพิ่มห้องใหม่</h2>
    <div class="row2">
      <div><label>ตึก / โซน *</label><select id="fBuilding"></select></div>
      <div><label>เลขห้อง *</label><input id="fNumber" placeholder="เช่น 101"></div>
    </div>
    <label>ราคาต่อเดือน (บาท) *</label><input id="fPrice" type="number" min="0" placeholder="เช่น 4500">
    <label>เฟอร์นิเจอร์</label>
    <textarea id="fFurn" placeholder="เช่น เตียง, ตู้เสื้อผ้า, แอร์, เครื่องทำน้ำอุ่น"></textarea>
    <label>สถานะ</label>
    <select id="fStatus">
      <option>ว่าง</option><option>มีผู้เช่า</option><option>จอง</option><option>ปิดปรับปรุง</option>
    </select>

    <div class="contractBox hidden" id="contractBox">
      <label>วันที่ทำสัญญา * (เลือกจากปฏิทิน)</label>
      <input id="fContract" type="date">
      <div class="hint" id="dueHint"></div>
    </div>

    <label>รูปภาพ <span id="imgCount" style="color:#999"></span></label>
    <input id="fFile" type="file" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <div class="hint">รูปแรก = รูปหน้าปก กด ★ เพื่อเปลี่ยนหน้าปก กด ✕ เพื่อลบรูป</div>

    <button class="btn" id="btnSave">บันทึก</button>
    <button class="btn ghost" id="btnClear">ล้างฟอร์ม / ยกเลิกการแก้ไข</button>
    <div class="msg" id="formMsg"></div>
  </aside>

  <main>
    <div class="filter">
      <div><label>ตึก / โซน</label><select id="fltBuilding"></select></div>
      <div><label>ราคาต่ำสุด</label><input id="minP" type="number" placeholder="เช่น 4000"></div>
      <div><label>ราคาสูงสุด</label><input id="maxP" type="number" placeholder="เช่น 5000"></div>
      <div><label>สถานะห้อง</label>
        <select id="fltStatus"><option value="">ทั้งหมด</option><option>ว่าง</option>
        <option>มีผู้เช่า</option><option>จอง</option><option>ปิดปรับปรุง</option></select></div>
      <div><label>สถานะค่าเช่า</label>
        <select id="fltPay"><option value="">ทั้งหมด</option>
        <option value="overdue">เกินกำหนดชำระ</option><option value="upcoming">ยังไม่ถึงกำหนด</option>
        <option value="paid">จ่ายแล้ว</option></select></div>
      <div><label>ค้นหา (เลขห้อง / เฟอร์นิเจอร์)</label><input id="q" placeholder="เช่น 101 หรือ แอร์"></div>
      <div><label>เรียงตาม</label>
        <select id="sort"><option value="no">ตึก → เลขห้อง</option><option value="pa">ราคา ต่ำ → สูง</option>
        <option value="pd">ราคา สูง → ต่ำ</option></select></div>
      <button class="btn ghost" id="btnReset">รีเซ็ต</button>
    </div>

    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<input type="file" id="quickFile" accept="image/*" multiple class="hidden">

<!-- แกลเลอรีรูป -->
<div id="modal" class="modal hidden">
  <div class="mbox">
    <button id="mClose">✕ ปิด</button>
    <h3 id="mTitle"></h3>
    <div class="mmain">
      <button class="nav" id="mPrev">‹</button>
      <img id="mImg" alt="">
      <button class="nav" id="mNext">›</button>
    </div>
    <div class="mthumbs" id="mThumbs"></div>
    <div class="minfo" id="mInfo"></div>
  </div>
</div>

<!-- ปฏิทินค่าเช่า + ประวัติ -->
<div id="calModal" class="modal hidden">
  <div class="mbox">
    <button id="calClose">✕ ปิด</button>
    <h3 id="calTitle"></h3>
    <div class="calinfo" id="calInfo"></div>
    <div class="calnav">
      <button id="calPrev">‹</button><b id="calMonth"></b><button id="calNext">›</button>
    </div>
    <div class="cal" id="calGrid"></div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>จ่ายแล้ว</span>
      <span><i style="background:var(--book)"></i>รอชำระ</span>
      <span><i style="background:var(--busy)"></i>เกินกำหนด</span>
      <span><i style="background:#e9dcc8"></i>วันทำสัญญา</span>
      <span><i style="outline:2px solid var(--brown)"></i>วันนี้</span>
    </div>
    <div class="panel" id="calPanel"></div>
    <h2>ประวัติการชำระค่าเช่า</h2>
    <div class="tblwrap" id="calHist"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://mhkafvwzkbodsaymcgrv.supabase.co';   // Project URL (ไม่มี /rest/v1/)
  const SUPABASE_KEY = 'sb_publishable_jX2jb6ayKKVZuOSOhQiWHw_Ewx4z8iJ';   // publishable / anon key
  const BUCKET = 'room-images';
  const MAX_IMAGES = 10;
  const BUILDINGS = ['A','B','C','D','E','F','G','H','I','J','K'];
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const COLORS = {'ว่าง':'var(--ok)','มีผู้เช่า':'var(--busy)','จอง':'var(--book)','ปิดปรับปรุง':'var(--fix)'};
  const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const WEEK = ['อา','จ','อ','พ','พฤ','ศ','ส'];

  let rooms = [], payMap = {}, editingId = null, formImages = [], oldImages = [];

  /* ---------- ตัวช่วยวันที่ / เงิน ---------- */
  const pad = n => String(n).padStart(2,'0');
  const lastDayOf = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();      // m = 1-12
  const parseDate = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return {y,m,d}; };
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const dayNum = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  const shortDate = s => { const p = parseDate(s); return `${p.d} ${MONTHS[p.m - 1]}`; };
  const fmtDate = s => { const p = parseDate(s); return `${p.d} ${MONTHS[p.m - 1]} ${p.y + 543}`; };
  const periodLabel = pk => { const [y,m] = pk.split('-').map(Number); return `${MONTHS[m - 1]} ${y + 543}`; };
  const money = n => '฿' + Number(n).toLocaleString();
  const addMonths = (pk, n) => {
    const [y, m] = pk.split('-').map(Number), t = y * 12 + (m - 1) + n;
    return `${Math.floor(t / 12)}-${pad(t % 12 + 1)}`;
  };

  function thaiToday(){
    const p = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Bangkok', year:'numeric', month:'2-digit', day:'2-digit'})
      .formatToParts(new Date());
    const g = t => +p.find(x => x.type === t).value;
    return {y:g('year'), m:g('month'), d:g('day')};
  }
  const todayStr = () => { const t = thaiToday(); return ymd(t.y, t.m, t.d); };

  /* ---------- สร้าง dropdown ตึก ---------- */
  $('fBuilding').innerHTML = '<option value="">-- เลือก --</option>' +
    BUILDINGS.map(b => `<option value="${b}">ตึก ${b}</option>`).join('');
  $('fltBuilding').innerHTML = '<option value="">ทุกตึก</option>' +
    BUILDINGS.map(b => `<option value="${b}">ตึก ${b}</option>`).join('') +
    '<option value="none">ยังไม่ระบุตึก</option>';

  /* ---------- ตรรกะค่าเช่า ---------- */
  const payOf = (rid, pk) => payMap[rid + '|' + pk];
  const paysOfRoom = rid => Object.values(payMap).filter(p => p.room_id == rid);

  // วันครบกำหนดของงวด pk (YYYY-MM) = วันเดียวกับวันที่ทำสัญญา (เดือนที่ไม่มีวันนั้น ใช้วันสุดท้ายของเดือน)
  function dueOf(r, pk){
    if (!r.contract_date) return null;
    const [y, m] = pk.split('-').map(Number), D = parseDate(r.contract_date).d;
    return ymd(y, m, Math.min(D, lastDayOf(y, m)));
  }

  function statusOf(r, pk){
    const due = dueOf(r, pk), pay = payOf(r.id, pk);
    if (pay) return {st:'paid', due, pay, diff:null};
    if (!due) return {st:'none', due:null, pay:null, diff:null};
    const t = thaiToday(), d = parseDate(due);
    const diff = dayNum(d.y, d.m, d.d) - dayNum(t.y, t.m, t.d);
    return {st: diff < 0 ? 'overdue' : 'upcoming', due, pay:null, diff};
  }

  // รายการงวดตั้งแต่เดือนที่ทำสัญญา ถึงเดือนปัจจุบัน
  function periodsOf(r){
    if (!r.contract_date) return [];
    const t = thaiToday(), c = parseDate(r.contract_date), out = [];
    let y = c.y, m = c.m;
    while (y < t.y || (y === t.y && m <= t.m)){
      out.push(`${y}-${pad(m)}`);
      m++; if (m > 12){ m = 1; y++; }
    }
    return out;
  }

  function payInfo(r){
    if (r.status !== 'มีผู้เช่า' || !r.contract_date) return null;
    const t = thaiToday(), D = parseDate(r.contract_date).d;
    const list = periodsOf(r).map(pk => ({pk, ...statusOf(r, pk)}));

    const late = list.filter(p => p.st === 'overdue');
    if (late.length){
      const o = late[0];
      return {key:'overdue', label:'เกินกำหนดชำระ', target:o.pk,
        note: late.length > 1 ? `ค้าง ${late.length} งวด · งวดเก่าสุดเลย ${-o.diff} วัน`
                              : `เลยกำหนด ${-o.diff} วัน (กำหนด ${shortDate(o.due)})`};
    }
    const cur = list[list.length - 1];
    if (!cur) return {key:'upcoming', label:'ยังไม่เริ่มสัญญา', note:`เริ่ม ${shortDate(r.contract_date)}`, target:null};

    if (cur.st === 'paid'){
      let y = t.y, m = t.m + 1; if (m > 12){ m = 1; y++; }
      const next = ymd(y, m, Math.min(D, lastDayOf(y, m)));
      return {key:'paid', label:'จ่ายแล้ว', note:`งวดถัดไป ${shortDate(next)}`, target:cur.pk};
    }
    return {key:'upcoming', target:cur.pk,
      label: cur.diff === 0 ? 'ครบกำหนดวันนี้' : 'ยังไม่ถึงกำหนด',
      note: cur.diff === 0 ? `กำหนด ${shortDate(cur.due)}` : `อีก ${cur.diff} วัน (กำหนด ${shortDate(cur.due)})`};
  }

  /* ---------- นาฬิกา ---------- */
  let lastDayKey = '';
  function tick(){
    $('clock').textContent = new Date().toLocaleString('th-TH',
      {timeZone:'Asia/Bangkok', dateStyle:'medium', timeStyle:'short'});
    const t = thaiToday(), k = `${t.y}-${t.m}-${t.d}`;
    if (k !== lastDayKey){ lastDayKey = k; render(); }
  }
  setInterval(tick, 30000);

  /* ---------- Auth ---------- */
  $('btnLogin').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({
      email: $('email').value.trim(), password: $('password').value });
    $('loginMsg').textContent = error ? 'ล็อกอินไม่สำเร็จ: ' + error.message : '';
    if (error) console.error(error);
  };
  $('password').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
  $('btnLogout').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); };

  sb.auth.onAuthStateChange((_e, session) => {
    setTimeout(() => {
      const on = !!session;
      $('loginView').classList.toggle('hidden', on);
      $('app').classList.toggle('hidden', !on);
      $('userEmail').textContent = session?.user?.email ?? '';
      if (on){ loadRooms(); tick(); } else { rooms = []; payMap = {}; }
    }, 0);
  });

  /* ---------- โหลดข้อมูล ---------- */
  async function loadRooms(){
    const [a, b] = await Promise.all([
      sb.from('rooms').select('*'),
      sb.from('payments').select('*')
    ]);
    if (a.error){ $('count').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + a.error.message; return; }
    if (b.error){ $('count').textContent = 'โหลดประวัติการชำระไม่สำเร็จ: ' + b.error.message; return; }
    rooms = a.data;
    payMap = {};
    b.data.forEach(p => payMap[p.room_id + '|' + p.period] = p);
    render();
    if (!$('calModal').classList.contains('hidden')) renderCal();
  }

  /* ---------- แสดงผลการ์ดห้อง ---------- */
  function byBuildingThenNumber(a, b){
    const ba = a.building || 'ZZ', bb = b.building || 'ZZ';
    return ba.localeCompare(bb) ||
      a.room_number.localeCompare(b.room_number, 'th', {numeric:true});
  }

  function render(){
    $('stAll').textContent  = rooms.length;
    $('stFree').textContent = rooms.filter(r => r.status === 'ว่าง').length;
    $('stBusy').textContent = rooms.filter(r => r.status === 'มีผู้เช่า').length;
    $('stWait').textContent = rooms.filter(r => payInfo(r)?.key === 'overdue').length;

    const min = parseFloat($('minP').value), max = parseFloat($('maxP').value);
    const bd = $('fltBuilding').value, st = $('fltStatus').value, pay = $('fltPay').value,
          q = $('q').value.trim().toLowerCase();

    let list = rooms.filter(r =>
      (!bd || (bd === 'none' ? !r.building : r.building === bd)) &&
      (isNaN(min) || r.price >= min) &&
      (isNaN(max) || r.price <= max) &&
      (!st || r.status === st) &&
      (!pay || payInfo(r)?.key === pay) &&
      (!q || r.room_number.toLowerCase().includes(q) || (r.furniture || '').toLowerCase().includes(q)));

    const s = $('sort').value;
    list.sort((a,b) => s === 'pa' ? a.price - b.price : s === 'pd' ? b.price - a.price
      : byBuildingThenNumber(a, b));

    const bdText = bd && bd !== 'none' ? ` ในตึก ${bd}` : '';
    $('count').textContent = `พบ ${list.length} ห้อง${bdText} จากทั้งหมด ${rooms.length} ห้อง`;

    $('grid').innerHTML = list.length ? list.map(r => {
      const imgs = r.images || [], p = payInfo(r), rented = r.status === 'มีผู้เช่า';
      let payBox = '';
      if (p){
        payBox = `<div class="pay ${p.key}">
          <div><b>${p.label}</b>${p.note}</div>
          ${p.key !== 'paid' && p.target ? `<button data-pay="${r.id}">✓ ยืนยันโอน</button>` : ''}
        </div>`;
      } else if (rented){
        payBox = `<div class="pay upcoming"><div><b>ยังไม่ระบุวันที่ทำสัญญา</b>กดแก้ไขเพื่อเลือกวันที่</div></div>`;
      }
      return `
      <div class="card">
        <div class="imgwrap" data-gal="${r.id}" title="กดเพื่อดูรูปทั้งหมด">
          ${imgs.length ? `<img src="${esc(imgs[0])}" alt="ห้อง ${esc(r.room_number)}" loading="lazy">
                          <span class="cnt">🖼 ${imgs.length} รูป</span>`
                        : `<div class="noimg">ไม่มีรูปภาพ</div>`}
          <span class="zone ${r.building ? '' : 'none'}">${r.building ? 'ตึก ' + esc(r.building) : 'ยังไม่ระบุตึก'}</span>
        </div>
        <div class="body">
          <div class="top"><span class="no">ห้อง ${esc(r.room_number)}</span>
            <span class="badge" style="background:${COLORS[r.status] || '#888'}">${esc(r.status)}</span></div>
          <div class="price">${money(r.price)} / เดือน</div>
          <div class="furn">${esc(r.furniture) || '-'}</div>
          ${rented && r.contract_date ? `<div class="contract">📝 ทำสัญญา ${fmtDate(r.contract_date)}</div>` : ''}
          ${payBox}
        </div>
        <div class="actions">
          <button class="edit" data-edit="${r.id}">แก้ไข</button>
          <button class="edit" data-addimg="${r.id}">📷 เพิ่มรูป</button>
          <button class="hist" data-hist="${r.id}">📅 ค่าเช่า</button>
          ${rented ? `<button class="endc" data-end="${r.id}">🔚 สิ้นสุดสัญญา</button>` : ''}
          <button class="del" data-del="${r.id}">ลบ</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty">ไม่พบห้องที่ตรงกับเงื่อนไข</div>`;
  }

  ['fltBuilding','minP','maxP','fltStatus','fltPay','q','sort'].forEach(id => $(id).addEventListener('input', render));
  $('btnReset').onclick = () => {
    ['fltBuilding','minP','maxP','fltStatus','fltPay','q'].forEach(id => $(id).value = '');
    $('sort').value = 'no'; render();
  };

  /* ---------- รูปในฟอร์ม ---------- */
  function renderThumbs(){
    $('thumbs').innerHTML = formImages.map((im, i) => `
      <div class="th ${i === 0 ? 'cover' : ''}">
        <img src="${esc(im.url)}" alt="">
        ${i === 0 ? '<span class="tag">หน้าปก</span>'
                  : `<button data-cover="${i}" title="ตั้งเป็นรูปหน้าปก">★</button>`}
        <button class="x" data-rm="${i}" title="ลบรูป">✕</button>
      </div>`).join('');
    $('imgCount').textContent = formImages.length ? `(${formImages.length}/${MAX_IMAGES})` : '';
  }

  $('fFile').onchange = e => {
    for (const f of e.target.files){
      if (formImages.length >= MAX_IMAGES){ alert(`เพิ่มได้สูงสุด ${MAX_IMAGES} รูปต่อห้อง`); break; }
      formImages.push({file:f, url:URL.createObjectURL(f)});
    }
    e.target.value = ''; renderThumbs();
  };

  $('thumbs').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rm !== undefined) formImages.splice(+b.dataset.rm, 1);
    if (b.dataset.cover !== undefined) formImages.unshift(formImages.splice(+b.dataset.cover, 1)[0]);
    renderThumbs();
  };

  async function compress(file, maxSize = 1280, quality = 0.8){
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, maxSize / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(res, 'image/jpeg', quality));
  }

  async function uploadImage(file){
    const blob = await compress(file);
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await sb.storage.from(BUCKET).upload(path, blob, {contentType:'image/jpeg'});
    if (error) throw error;
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  async function removeImage(url){
    if (!url) return;
    const path = url.split(`/${BUCKET}/`)[1];
    if (path) await sb.storage.from(BUCKET).remove([decodeURIComponent(path)]);
  }

  /* ---------- ฟอร์ม ---------- */
  function updateDueHint(){
    const v = $('fContract').value;
    $('dueHint').textContent = v
      ? `ครบกำหนดจ่ายทุกวันที่ ${parseDate(v).d} ของเดือน (เดือนที่ไม่มีวันที่นี้ ใช้วันสุดท้ายของเดือน)`
      : 'เลือกวันที่ทำสัญญา ระบบจะใช้วันนี้เป็นวันครบกำหนดจ่ายทุกเดือน';
  }
  function toggleContract(){
    $('contractBox').classList.toggle('hidden', $('fStatus').value !== 'มีผู้เช่า');
    updateDueHint();
  }
  $('fStatus').addEventListener('change', toggleContract);
  $('fContract').addEventListener('input', updateDueHint);

  function clearForm(){
    editingId = null; formImages = []; oldImages = [];
    ['fNumber','fPrice','fFurn','fContract'].forEach(id => $(id).value = '');
    $('fBuilding').value = '';
    $('fStatus').value = 'ว่าง';
    $('formTitle').textContent = 'เพิ่มห้องใหม่';
    $('formMsg').textContent = '';
    toggleContract(); renderThumbs();
  }
  $('btnClear').onclick = clearForm;

  /* ---------- ประวัติการชำระ: เลื่อน / ลบ ---------- */
  // เลื่อนงวดของห้องไป n เดือน (ลำดับการอัปเดตป้องกันชนกับ unique)
  async function shiftPayments(roomId, n){
    const list = paysOfRoom(roomId).sort((a, b) => a.period.localeCompare(b.period));
    if (n > 0) list.reverse();
    for (const p of list){
      const { error } = await sb.from('payments').update({period: addMonths(p.period, n)}).eq('id', p.id);
      if (error) throw error;
    }
  }
  async function clearPayments(roomId){
    const { error } = await sb.from('payments').delete().eq('room_id', roomId);
    if (error) throw error;
  }

  /* ---------- สิ้นสุดสัญญา ---------- */
  async function endContract(r){
    const name = `${r.building ? 'ตึก ' + r.building + ' ' : ''}ห้อง ${r.room_number}`;
    const lateN = periodsOf(r).filter(pk => statusOf(r, pk).st === 'overdue').length;
    let m = `สิ้นสุดสัญญา ${name} ?\nสถานะจะเปลี่ยนเป็น "ว่าง" ทันที และล้างวันที่ทำสัญญา`;
    if (lateN) m += `\n\n⚠ ห้องนี้ยังค้างชำระ ${lateN} งวด`;
    if (!confirm(m)) return;

    const cnt = paysOfRoom(r.id).length;
    const clear = cnt > 0 && confirm(
      `ห้องนี้มีประวัติการชำระ ${cnt} งวด\n\n` +
      `ตกลง = ลบประวัติของผู้เช่าเดิม (เริ่มบิลใหม่ให้ผู้เช่าคนถัดไป)\n` +
      `ยกเลิก = เก็บประวัติไว้`);

    try {
      const { error } = await sb.from('rooms')
        .update({status:'ว่าง', contract_date:null, due_day:null}).eq('id', r.id);
      if (error) throw error;
      if (clear) await clearPayments(r.id);
    } catch (err){ alert('ทำรายการไม่สำเร็จ: ' + (err.message || err)); }
    loadRooms();
  }

  /* ---------- กดปุ่มบนการ์ด ---------- */
  let quickId = null;
  $('grid').onclick = async e => {
    const b = e.target.closest('[data-edit],[data-del],[data-pay],[data-gal],[data-hist],[data-addimg],[data-end]');
    if (!b) return;
    const id = b.dataset.edit ?? b.dataset.del ?? b.dataset.pay ?? b.dataset.gal
            ?? b.dataset.hist ?? b.dataset.addimg ?? b.dataset.end;
    const r = rooms.find(x => x.id == id);
    if (!r) return;

    if (b.dataset.gal !== undefined) return openGallery(r);
    if (b.dataset.pay !== undefined) return openCal(r, payInfo(r)?.target);
    if (b.dataset.hist !== undefined) return openCal(r, payInfo(r)?.target);
    if (b.dataset.addimg !== undefined){ quickId = r.id; return $('quickFile').click(); }
    if (b.dataset.end !== undefined) return endContract(r);

    if (b.dataset.edit !== undefined){
      editingId = r.id; oldImages = [...(r.images || [])];
      formImages = oldImages.map(url => ({url}));
      $('fBuilding').value = r.building || '';
      $('fNumber').value = r.room_number; $('fPrice').value = r.price;
      $('fFurn').value = r.furniture || ''; $('fStatus').value = r.status;
      $('fContract').value = r.contract_date || '';
      $('formTitle').textContent = `แก้ไขห้อง ${r.building ? r.building + '-' : ''}${r.room_number}`;
      toggleContract(); renderThumbs(); window.scrollTo({top:0, behavior:'smooth'});
    }

    if (b.dataset.del !== undefined){
      if (!confirm(`ยืนยันการลบห้อง ${r.building ? 'ตึก ' + r.building + ' ' : ''}${r.room_number} ?\nประวัติการชำระค่าเช่าของห้องนี้จะถูกลบไปด้วย`)) return;
      const { error } = await sb.from('rooms').delete().eq('id', r.id);
      if (error) return alert('ลบไม่สำเร็จ: ' + error.message);
      for (const u of (r.images || [])) await removeImage(u);
      loadRooms();
    }
  };

  /* ---------- เพิ่มรูปด่วน (ไม่ต้องเปิดฟอร์ม ไม่ต้องใส่วันที่) ---------- */
  $('quickFile').onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    const r = rooms.find(x => x.id == quickId);
    if (!r || !files.length) return;
    const cur = [...(r.images || [])], space = MAX_IMAGES - cur.length;
    if (space <= 0) return alert(`ห้องนี้มีรูปครบ ${MAX_IMAGES} รูปแล้ว`);
    if (files.length > space) alert(`เพิ่มได้อีก ${space} รูป ระบบจะใช้ ${space} รูปแรก`);
    $('count').textContent = 'กำลังอัปโหลดรูป...';
    try {
      for (const f of files.slice(0, space)) cur.push(await uploadImage(f));
      const { error } = await sb.from('rooms').update({images: cur}).eq('id', r.id);
      if (error) throw error;
    } catch (err){ alert('อัปโหลดไม่สำเร็จ: ' + (err.message || err)); }
    loadRooms();
  };

  /* ---------- บันทึกห้อง ---------- */
  $('btnSave').onclick = async () => {
    const msg = $('formMsg'), btn = $('btnSave');
    const building = $('fBuilding').value, status = $('fStatus').value;
    const number = $('fNumber').value.trim(), price = parseFloat($('fPrice').value);
    const rented = status === 'มีผู้เช่า', cdate = $('fContract').value;

    if (!building || !number || isNaN(price) || (rented && !cdate)){
      msg.style.color = '#a03a35';
      msg.textContent = rented ? 'กรุณาเลือกตึก กรอกเลขห้อง ราคา และวันที่ทำสัญญา'
                               : 'กรุณาเลือกตึก กรอกเลขห้อง และราคา';
      return;
    }

    // ตรวจว่าต้องเลื่อน / ล้างประวัติการชำระไหม
    const old = editingId ? rooms.find(x => x.id == editingId) : null;
    let shiftBy = 0, clearOld = false;
    if (old && rented){
      const pays = paysOfRoom(old.id);
      const wasRented = old.status === 'มีผู้เช่า' && old.contract_date;
      if (wasRented && pays.length){
        const a = parseDate(old.contract_date), b = parseDate(cdate);
        const diff = (b.y * 12 + b.m) - (a.y * 12 + a.m);
        if (diff !== 0){
          const ok = confirm(
            `เปลี่ยนวันที่ทำสัญญา\nจาก ${fmtDate(old.contract_date)}\nเป็น ${fmtDate(cdate)}\n` +
            `(${diff > 0 ? 'เลื่อนไปข้างหน้า' : 'ย้อนกลับ'} ${Math.abs(diff)} เดือน)\n\n` +
            `ประวัติการชำระ ${pays.length} งวดจะเลื่อนตามไปด้วย (วันที่โอนและจำนวนเงินไม่เปลี่ยน)\n\n` +
            `ตกลง = บันทึกและเลื่อนประวัติตาม\nยกเลิก = ไม่บันทึก`);
          if (!ok) return;
          shiftBy = diff;
        }
      } else if (!wasRented && pays.length){
        clearOld = confirm(
          `ห้องนี้มีประวัติการชำระเก่า ${pays.length} งวด (จากผู้เช่าเดิม)\n\n` +
          `ตกลง = ลบประวัติเก่า แล้วเริ่มบิลใหม่\n` +
          `ยกเลิก = เก็บไว้ (งวดเดือนเดียวกันจะถูกนับว่าจ่ายแล้ว)`);
      }
    }

    btn.disabled = true; msg.style.color = '#6b5645'; msg.textContent = 'กำลังบันทึก...';

    try {
      const finalUrls = [];
      for (const im of formImages) finalUrls.push(im.file ? await uploadImage(im.file) : im.url);
      const removed = oldImages.filter(u => !finalUrls.includes(u));

      const payload = {
        building, room_number: number, price, status,
        furniture: $('fFurn').value.trim(), images: finalUrls,
        contract_date: rented ? cdate : null,
        due_day: rented ? parseDate(cdate).d : null
      };
      const { error } = editingId
        ? await sb.from('rooms').update(payload).eq('id', editingId)
        : await sb.from('rooms').insert(payload);
      if (error) throw error;

      if (shiftBy) await shiftPayments(old.id, shiftBy);
      if (clearOld) await clearPayments(old.id);

      for (const u of removed) await removeImage(u);
      clearForm(); msg.style.color = 'var(--ok)';
      msg.textContent = shiftBy ? 'บันทึกเรียบร้อย และเลื่อนประวัติการชำระตามแล้ว ✓' : 'บันทึกเรียบร้อย ✓';
      loadRooms();
    } catch (err){
      msg.style.color = '#a03a35';
      msg.textContent = err.code === '23505' ? `ตึก ${building} มีห้อง ${number} อยู่แล้ว`
                                             : 'ผิดพลาด: ' + (err.message || err);
      loadRooms();
    } finally { btn.disabled = false; }
  };

  /* ---------- ปฏิทินค่าเช่า ---------- */
  let calRoomId = null, calY = 0, calM = 0, selPk = null;

  function openCal(r, pk){
    const t = thaiToday();
    calRoomId = r.id; selPk = pk || null;
    if (pk){ const [y, m] = pk.split('-').map(Number); calY = y; calM = m; }
    else { calY = t.y; calM = t.m; }
    $('calModal').classList.remove('hidden'); renderCal();
  }
  const closeCal = () => { $('calModal').classList.add('hidden'); calRoomId = null; };
  const showErr = (el, err) => {
    console.error(err);
    el.innerHTML = `<div class="errbox">แสดงผลไม่สำเร็จ: ${esc(err.message || err)}</div>`;
  };

  function renderCal(){
    const r = rooms.find(x => x.id == calRoomId); if (!r) return closeCal();
    try { renderCalGrid(r); } catch (err){ showErr($('calGrid'), err); }
    try { renderPanel(r); }   catch (err){ showErr($('calPanel'), err); }
    try { renderHist(r); }    catch (err){ showErr($('calHist'), err); }
  }

  function renderCalGrid(r){
    const t = thaiToday();
    $('calTitle').textContent = `${r.building ? 'ตึก ' + r.building + ' · ' : ''}ห้อง ${r.room_number} · ค่าเช่า`;
    $('calInfo').textContent = r.contract_date
      ? `${money(r.price)} / เดือน · ทำสัญญา ${fmtDate(r.contract_date)} · ครบกำหนดทุกวันที่ ${parseDate(r.contract_date).d}`
      : 'ห้องนี้ไม่มีวันที่ทำสัญญา (แสดงเฉพาะประวัติที่เคยบันทึกไว้)';
    $('calMonth').textContent = `${MONTHS_FULL[calM - 1]} ${calY + 543}`;

    const c = r.contract_date ? parseDate(r.contract_date) : null;
    const active = c && (calY > c.y || (calY === c.y && calM >= c.m));
    const pk = `${calY}-${pad(calM)}`;
    const s = active ? statusOf(r, pk) : null;
    const dueDay = s && s.due ? parseDate(s.due).d : null;
    const label = {paid:'✓ จ่ายแล้ว', upcoming:'รอจ่าย', overdue:'เกินกำหนด'};

    let h = WEEK.map(w => `<div class="wd">${w}</div>`).join('');
    h += '<div></div>'.repeat(new Date(Date.UTC(calY, calM - 1, 1)).getUTCDay());
    for (let d = 1; d <= lastDayOf(calY, calM); d++){
      const cls = ['day'];
      if (calY === t.y && calM === t.m && d === t.d) cls.push('today');
      if (c && c.y === calY && c.m === calM && c.d === d) cls.push('start');
      let attr = '', extra = '';
      if (d === dueDay){
        cls.push('due', s.st); attr = `data-pk="${pk}"`;
        if (selPk === pk) cls.push('sel');
        extra = `<small>${label[s.st] || ''}</small>`;
      }
      h += `<div class="${cls.join(' ')}" ${attr}>${d}${extra}</div>`;
    }
    $('calGrid').innerHTML = h;
  }

  // กล่องยืนยันการโอนของงวดที่เลือก
  function renderPanel(r){
    if (!selPk){
      $('calPanel').innerHTML = `<div class="hint">${r.contract_date
        ? 'กดวันที่ครบกำหนด (ช่องสี) ในปฏิทิน หรือกดแถวในตารางด้านล่าง เพื่อยืนยันการโอนของงวดนั้น'
        : 'ไม่มีงวดที่ต้องเก็บ'}</div>`;
      return;
    }
    const s = statusOf(r, selPk);
    const head = `<b>งวด ${periodLabel(selPk)}</b>${s.due ? ' · กำหนด ' + fmtDate(s.due) : ''}`;

    if (s.pay){
      $('calPanel').innerHTML = `${head}
        <div class="pnote paid">✓ ชำระแล้วเมื่อ ${fmtDate(s.pay.paid_at)} · ${money(s.pay.amount)}</div>
        <button class="btn ghost" id="btnPayCancel">ยกเลิกการชำระงวดนี้</button>`;
      return;
    }
    const late = s.st === 'overdue' ? `<div class="pnote overdue">เกินกำหนดชำระ ${-s.diff} วัน</div>` : '';
    $('calPanel').innerHTML = `${head}${late}
      <div class="row2b">
        <div><label>วันที่โอน</label><input type="date" id="pDate" value="${todayStr()}"></div>
        <div><label>จำนวนเงิน (บาท)</label><input type="number" id="pAmount" min="0" value="${Number(r.price)}"></div>
      </div>
      <button class="btn" id="btnPaySave">✓ ยืนยันการโอน</button>`;
  }

  // ตารางประวัติ (ติ๊กจ่ายได้เลย)
  function renderHist(r){
    const keys = new Set(periodsOf(r));
    paysOfRoom(r.id).forEach(p => keys.add(p.period));
    const rows = [...keys].sort().reverse();
    if (!rows.length){ $('calHist').innerHTML = '<div class="hint">ยังไม่มีประวัติ</div>'; return; }

    let total = 0, n = 0;
    const body = rows.map(pk => {
      const s = statusOf(r, pk);
      let txt, dateCell = '-', amtCell = '-';
      if (s.pay){
        total += Number(s.pay.amount); n++;
        let late = '';
        if (s.due){
          const a = parseDate(s.pay.paid_at), b = parseDate(s.due);
          const dl = dayNum(a.y, a.m, a.d) - dayNum(b.y, b.m, b.d);
          if (dl > 0) late = `<span class="late">จ่ายช้า ${dl} วัน</span>`;
        }
        txt = `✓ จ่ายแล้ว${late}`;
        dateCell = `<input type="date" class="inD" data-pk="${pk}" value="${esc(String(s.pay.paid_at).slice(0,10))}">`;
        amtCell  = `<input type="number" class="inA" data-pk="${pk}" min="0" value="${Number(s.pay.amount)}">`;
      } else {
        txt = s.st === 'overdue' ? `เกินกำหนด ${-s.diff} วัน` : 'รอชำระ';
      }
      return `<tr class="row ${pk === selPk ? 'on' : ''}" data-pk="${pk}">
        <td class="chk"><input type="checkbox" class="inChk" data-pk="${pk}" ${s.pay ? 'checked' : ''}></td>
        <td>${periodLabel(pk)}</td>
        <td>${s.due ? fmtDate(s.due) : '-'}</td>
        <td class="st ${s.st}">${txt}</td>
        <td>${dateCell}</td>
        <td class="num">${amtCell}</td></tr>`;
    }).join('');

    $('calHist').innerHTML = `<table class="histT"><thead><tr>
      <th class="chk">จ่ายแล้ว</th><th>งวด</th><th>กำหนดจ่าย</th><th>สถานะ</th><th>วันที่โอน</th><th>จำนวนเงิน</th>
      </tr></thead><tbody>${body}</tbody></table>
      <div class="sum">ชำระแล้ว ${n} งวด รวม ${money(total)}</div>
      <div class="hint">ติ๊กช่องหน้าแถวเพื่อบันทึกว่าจ่ายแล้ว (วันที่โอน = วันนี้) แก้วันที่หรือจำนวนเงินได้ในแถวเลย</div>`;
  }

  function gotoPeriod(pk){
    selPk = pk; const [y, m] = pk.split('-').map(Number); calY = y; calM = m; renderCal();
  }
  $('calGrid').onclick = e => { const d = e.target.closest('[data-pk]'); if (d) gotoPeriod(d.dataset.pk); };

  $('calPrev').onclick = () => { calM--; if (calM < 1){ calM = 12; calY--; } renderCal(); };
  $('calNext').onclick = () => { calM++; if (calM > 12){ calM = 1; calY++; } renderCal(); };
  $('calClose').onclick = closeCal;
  $('calModal').onclick = e => { if (e.target === $('calModal')) closeCal(); };

  async function savePayment(r, pk, paid_at, amount){
    const { error } = await sb.from('payments')
      .upsert({room_id: r.id, period: pk, paid_at, amount}, {onConflict:'room_id,period'});
    if (error) throw error;
  }
  async function cancelPayment(r, pk){
    const { error } = await sb.from('payments').delete().eq('room_id', r.id).eq('period', pk);
    if (error) throw error;
  }

  // ปุ่มในกล่องยืนยัน
  $('calPanel').onclick = async e => {
    const r = rooms.find(x => x.id == calRoomId); if (!r || !selPk) return;

    if (e.target.id === 'btnPaySave'){
      const paid_at = $('pDate').value, amount = parseFloat($('pAmount').value);
      if (!paid_at || isNaN(amount) || amount < 0) return alert('กรุณาเลือกวันที่โอน และกรอกจำนวนเงินให้ถูกต้อง');
      e.target.disabled = true;
      try { await savePayment(r, selPk, paid_at, amount); }
      catch (err){ e.target.disabled = false; return alert('บันทึกไม่สำเร็จ: ' + err.message); }
      loadRooms();
    }

    if (e.target.id === 'btnPayCancel'){
      if (!confirm(`ยกเลิกการชำระงวด ${periodLabel(selPk)} ?`)) return;
      try { await cancelPayment(r, selPk); }
      catch (err){ return alert('ยกเลิกไม่สำเร็จ: ' + err.message); }
      loadRooms();
    }
  };

  // กดแถวในตารางเพื่อเลือกงวด
  $('calHist').onclick = e => {
    if (e.target.closest('input')) return;
    const tr = e.target.closest('tr[data-pk]');
    if (tr) gotoPeriod(tr.dataset.pk);
  };

  // ติ๊กจ่าย / แก้วันที่ / แก้จำนวนเงินในตาราง
  $('calHist').onchange = async e => {
    const el = e.target, pk = el.dataset.pk;
    const r = rooms.find(x => x.id == calRoomId);
    if (!r || !pk) return;

    if (el.classList.contains('inChk')){
      el.disabled = true;
      try {
        if (el.checked){
          await savePayment(r, pk, todayStr(), Number(r.price));
        } else {
          if (!confirm(`ยกเลิกการชำระงวด ${periodLabel(pk)} ?`)){ el.checked = true; el.disabled = false; return; }
          await cancelPayment(r, pk);
        }
      } catch (err){
        alert('บันทึกไม่สำเร็จ: ' + err.message);
        el.disabled = false; el.checked = !el.checked; return;
      }
      return loadRooms();
    }

    if (el.classList.contains('inD') || el.classList.contains('inA')){
      const row = el.closest('tr');
      const paid_at = row.querySelector('.inD').value;
      const amount = parseFloat(row.querySelector('.inA').value);
      if (!paid_at || isNaN(amount) || amount < 0){
        alert('กรุณากรอกวันที่โอนและจำนวนเงินให้ถูกต้อง'); return renderCal();
      }
      try { await savePayment(r, pk, paid_at, amount); }
      catch (err){ alert('บันทึกไม่สำเร็จ: ' + err.message); }
      loadRooms();
    }
  };

  /* ---------- แกลเลอรี ---------- */
  let galImgs = [], galIdx = 0;
  function openGallery(r){
    galImgs = r.images || []; galIdx = 0;
    if (!galImgs.length) return;
    const p = payInfo(r);
    $('mTitle').textContent = `${r.building ? 'ตึก ' + r.building + ' · ' : ''}ห้อง ${r.room_number} · ${r.status}`;
    $('mInfo').textContent = `${money(r.price)} / เดือน\n${r.furniture || '-'}`
      + (p ? `\nค่าเช่า: ${p.label} — ${p.note}` : '');
    $('modal').classList.remove('hidden'); showImg();
  }
  function showImg(){
    $('mImg').src = galImgs[galIdx];
    $('mThumbs').innerHTML = galImgs.map((u, i) =>
      `<img src="${esc(u)}" class="${i === galIdx ? 'on' : ''}" data-i="${i}">`).join('');
    const multi = galImgs.length > 1;
    $('mPrev').classList.toggle('hidden', !multi); $('mNext').classList.toggle('hidden', !multi);
  }
  const step = d => { galIdx = (galIdx + d + galImgs.length) % galImgs.length; showImg(); };
  const closeGal = () => $('modal').classList.add('hidden');
  $('mPrev').onclick = () => step(-1);
  $('mNext').onclick = () => step(1);
  $('mClose').onclick = closeGal;
  $('modal').onclick = e => { if (e.target === $('modal')) closeGal(); };
  $('mThumbs').onclick = e => { if (e.target.dataset.i){ galIdx = +e.target.dataset.i; showImg(); } };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ closeGal(); closeCal(); }
    if ($('modal').classList.contains('hidden')) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  toggleContract(); renderThumbs();
</script>
</body>
</html>
